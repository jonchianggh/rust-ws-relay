name: Release

# Push a tag like v0.1.0 to build static Linux binaries and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rust-ws-relay dist/
          tar -C dist -czf rust-ws-relay-${{ matrix.target }}.tar.gz rust-ws-relay
          sha256sum rust-ws-relay-${{ matrix.target }}.tar.gz > rust-ws-relay-${{ matrix.target }}.tar.gz.sha256
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ws-relay-${{ matrix.target }}
          path: rust-ws-relay-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rust-ws-relay-*.tar.gz*
          generate_release_notes: true
