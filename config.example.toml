# rust-ws-relay example configuration.
# Copy to config.toml and replace EVERY secret below. Generate values with:
#   rust-ws-relay gen                      # random path + UUID
#   openssl rand -base64 32                # SS-2022 256-bit key (16 for aes-128)

# Plain HTTP; TLS is terminated in front (InstaBox port URL, a CDN, Nginx...).
listen = "0.0.0.0:3000"

# Public hostname clients use. Only used by `rust-ws-relay links`.
domain = "relay.example.com"

handshake_timeout_secs = 10     # time allowed to send a protocol header
idle_timeout_secs = 300         # close a connection with no traffic for this long
block_private_addresses = true  # never proxy to 127/8, 10/8, 192.168/16, ::1, ...

# UDP: VLESS command 2, and sing-box UDP-over-TCP on Shadowsocks/SOCKS5.
# DNS datagrams always go to dns_upstream.
[udp]
enabled = true
dns_upstream = "1.1.1.1:53"
dns_only = false                # true = relay DNS only, refuse other UDP
idle_timeout_secs = 60

# The cover website for every request that isn't a valid proxy handshake.
[decoy]
mode = "builtin"                # a small, generic status page
# mode = "static"               # serve your own site
# dir = "/opt/rust-ws-relay/site"
# mode = "reverse"              # mirror a real site (http:// upstream)
# upstream = "http://example.org"

[[inbounds]]
path = "/change-me-vless"
protocol = "vless"
uuid = "00000000-0000-4000-8000-000000000000"

[[inbounds]]
path = "/change-me-ss2022"
protocol = "shadowsocks"
method = "2022-blake3-aes-256-gcm"
password = "REPLACE_WITH_BASE64_32_BYTE_KEY="

[[inbounds]]
path = "/change-me-ss"
protocol = "shadowsocks"
method = "chacha20-ietf-poly1305"   # or aes-256-gcm / aes-128-gcm
password = "replace-with-a-long-random-password"

[[inbounds]]
path = "/change-me-socks"
protocol = "socks5"
username = "change-me"
password = "replace-with-a-long-random-password"
