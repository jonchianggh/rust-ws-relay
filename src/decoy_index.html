<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Status</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         max-width: 42rem; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.6; }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .muted { color: #6b7280; }
  .ok { color: #16a34a; font-weight: 600; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: .6rem 0; }
  footer { margin-top: 2.5rem; font-size: .85rem; }
</style>
</head>
<body>
  <h1>Northwind Status</h1>
  <p class="muted">All systems operational.</p>
  <ul>
    <li><span>API</span><span class="ok">Operational</span></li>
    <li><span>Dashboard</span><span class="ok">Operational</span></li>
    <li><span>Background jobs</span><span class="ok">Operational</span></li>
    <li><span>Object storage</span><span class="ok">Operational</span></li>
  </ul>
  <p class="muted">Last checked just now. Metrics refresh every 60 seconds.</p>
  <footer class="muted">&copy; Northwind. Contact support for access.</footer>
</body>
</html>
